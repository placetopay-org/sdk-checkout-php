name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🔒 Security'
    labels: [security]
  - title: '💥 Breaking changes'
    labels: [breaking]
  - title: '🚀 Features'
    labels: [feature, enhancement]
  - title: '🐛 Bug fixes'
    labels: [bug, fix]
  - title: '📚 Documentation'
    labels: [docs]
  - title: '🧪 Tests & tooling'
    labels: [test, ci, chore]
  - title: '⬆️ Dependencies'
    labels: [dependencies]
    collapse-after: 5

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels: [breaking]
  minor:
    labels: [feature, enhancement]
  patch:
    labels: [bug, fix, security, docs, test, ci, chore, dependencies]

template: |
  ## What's Changed

  $CHANGES
