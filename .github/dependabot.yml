version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      guzzle:
        patterns: ["guzzlehttp/*"]
      testing:
        patterns: ["phpunit/*", "phpstan/*", "friendsofphp/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
