name: Release

# Packagist discovers new versions automatically via the GitHub webhook.
# This workflow validates the release, runs the full test matrix, and
# creates a signed GitHub Release.
#
# Tag a release commit with a SemVer tag and push it to trigger:
#
#   git tag v1.0.0
#   git push origin v1.0.0

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    name: Validate on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-dev

      - name: Install dev dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite=Unit

      - name: Static analysis
        run: vendor/bin/phpstan analyse

      - name: Code style check
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
