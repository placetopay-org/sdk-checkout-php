name: ✨ Feature request
description: Suggest an addition or improvement
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before requesting: check whether the feature exists in one of the
        sibling SDKs (`checkout-java`, `checkout-dotnet`) or in the PHP
        reference (`dnetix/redirection`). If yes, that's a parity ticket.

  - type: textarea
    id: use-case
    attributes:
      label: What's the use case?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Rough sketch of the method / class / option you'd like to see.
      render: php

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you already tried, or existing SDK features that partially solve it.

  - type: dropdown
    id: parity
    attributes:
      label: Does this exist in another SDK?
      options:
        - Yes — in the Java SDK (checkout-java)
        - Yes — in the .NET SDK (checkout-dotnet)
        - Yes — in the Python SDK (checkout-python)
        - Yes — in the legacy PHP SDK (dnetix/redirection)
        - No — this is net-new
        - Not sure
    validations:
      required: true
